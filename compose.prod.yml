name: visualsofdsa.prod

services:
  web:
    # Built in GitHub Actions and pulled from GHCR (see .github/workflows/ci-cd.yml).
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_OWNER:?Set DOCKER_IMAGE_OWNER in .env}/visualsofdsa:${DOCKER_IMAGE_TAG:-main}
    container_name: visualsofdsa-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: ${VISUALSOFDSA_ENVFILE:-.env}
    # Inside the compose network the database is reachable as `db`, not localhost.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-visualsofdsa}
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-visualsofdsa}
    depends_on:
      db:
        condition: service_healthy
    # No host `ports:`. The shared edge nginx (/opt/edge) reaches this container over the
    # `edge` network. The alias is project-prefixed on purpose: a bare `web` would collide
    # with every other repo on that network. The vhost is nginx/visualsofdsa.conf.
    networks:
      visualsofdsa-internal:
      edge:
        aliases: [visualsofdsa-web]

  # One-off migration runner (not started by `up`; use scripts/deploy.sh). Manual usage:
  #   docker compose -f compose.prod.yml run --rm migrate
  #   docker compose -f compose.prod.yml run --rm migrate pnpm exec prisma db init   # first deploy
  migrate:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_OWNER:?Set DOCKER_IMAGE_OWNER in .env}/visualsofdsa-tools:${DOCKER_IMAGE_TAG:-main}
    command: ["pnpm", "exec", "prisma", "db", "migrate"]
    profiles: ["tools"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-visualsofdsa}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - visualsofdsa-internal

  # One-off seed runner (not started by `up`; use scripts/seed.sh). Same image as migrate.
  #   docker compose -f compose.prod.yml run --rm seed
  seed:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_OWNER:?Set DOCKER_IMAGE_OWNER in .env}/visualsofdsa-tools:${DOCKER_IMAGE_TAG:-main}
    command: ["pnpm", "db:seed"]
    profiles: ["tools"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-visualsofdsa}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - visualsofdsa-internal

  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-visualsofdsa}
    # No `ports:` on purpose. Only containers on visualsofdsa-internal reach the database,
    # as `db:5432` through Docker's DNS. For admin access use `docker compose exec db psql`.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-visualsofdsa}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - visualsofdsa-internal

volumes:
  db-data:
networks:
  # Pre-existing network on the VPS (shared with the reverse proxy).
  edge:
    external: true
  visualsofdsa-internal:
