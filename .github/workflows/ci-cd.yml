name: CI / Prod

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  run-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run lint and tests
        uses: Thiago-dcode/gh-actions/.github/actions/check-ci@v1
        with:
          package-manager: pnpm
  build-and-push:
    needs: run-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lowercase image name
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:main
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}

      # One-off migrate/seed image (Dockerfile `tools` stage). Shares the builder layers
      # with the build above through the local Docker layer cache, so it is cheap.
      - name: Build and push tools (migrate / seed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: tools
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}-tools:main
            ${{ env.REGISTRY }}/${{ env.IMAGE }}-tools:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    # Never cancelled: killing scripts/deploy.sh halfway (migrations, container recreation)
    # would leave prod half-applied. A newer run queues behind it instead.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    # `packages: read` lets the run's own GITHUB_TOKEN pull the images this workflow just
    # pushed, so no long-lived GHCR PAT is stored on the server.
    permissions:
      contents: read
      packages: read
    steps:
      # Custom composite action from Thiago-dcode/gh-actions: runs the deploy script on the
      # VPS over SSH, with the run's GITHUB_TOKEN for the GHCR pull and the immutable
      # `sha-<commit>` image tag. Pinned to a commit SHA, not a moving ref.
      - name: SSH deploy
        uses: Thiago-dcode/gh-actions/.github/actions/ssh-deploy@aeefa072cc9c649cf2ee116f21b1051668833187
        with:
          deploy-script: ${{ secrets.SSH_DEPLOY_DIR }}/scripts/deploy.sh
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          ghcr-user: ${{ github.actor }}
