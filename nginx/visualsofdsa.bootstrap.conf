# visualsofdsa vhost, HTTP only. Installed by scripts/deploy.sh while no certificate exists yet,
# so the edge nginx passes `nginx -t` (the full vhost points at a cert file that is not there)
# and Let's Encrypt can reach /.well-known/acme-challenge/. Once the cert is issued, the next
# deploy replaces this with nginx/visualsofdsa.conf. See docs/edge.md.
#
# $origin_allowed comes from the edge's 00-shared.conf (Cloudflare-only allowlist).

server {
    listen 80;
    server_name visualsofdsa.dev www.visualsofdsa.dev;
    server_tokens off;

    if ($origin_allowed = 0) {
        return 444;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 503;
    }
}
