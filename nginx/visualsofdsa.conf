# visualsofdsa vhost, installed into the shared edge nginx as conf.d/visualsofdsa.conf by
# scripts/deploy.sh (via /opt/edge/bin/install-vhost). See docs/edge.md.
#
#   visualsofdsa.dev       → visualsofdsa-web:3000
#   www.visualsofdsa.dev   → 301 to the apex
#
# The upstream name is the alias this service carries on the shared `edge` network (see
# compose.prod.yml), never a bare `web`, which another repo on the same network could claim.
# $origin_allowed, $connection_upgrade and the resolver come from the edge's 00-shared.conf.
# No http-level names (maps, limit zones) are defined here, so nothing can collide with the
# other vhosts that share one http context. Prefix any future one with `visualsofdsa_`.

# ─── :80 — ACME and redirect ─────────────────────────────────────────────────
server {
    listen 80;
    server_name visualsofdsa.dev www.visualsofdsa.dev;
    server_tokens off;

    if ($origin_allowed = 0) {
        return 444;
    }

    # Ahead of the redirect on purpose: Let's Encrypt validates over plain http, and
    # following a 301 to a host whose certificate has expired is the failure renewal
    # is meant to prevent.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://visualsofdsa.dev$request_uri;
    }
}

# ─── :443 — www → apex ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name www.visualsofdsa.dev;

    ssl_certificate     /etc/letsencrypt/live/visualsofdsa.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visualsofdsa.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    if ($origin_allowed = 0) {
        return 444;
    }

    return 301 https://visualsofdsa.dev$request_uri;
}

# ─── :443 — site ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name visualsofdsa.dev;

    ssl_certificate     /etc/letsencrypt/live/visualsofdsa.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visualsofdsa.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    if ($origin_allowed = 0) {
        return 444;
    }

    # Read-only visualizer: no uploads, no forms.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No includeSubDomains: it would bind every future subdomain to HTTPS, including one
    # created in a hurry for something unrelated. Add it deliberately, not by default.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $visualsofdsa_upstream http://visualsofdsa-web:3000;
        proxy_pass $visualsofdsa_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_hide_header X-Powered-By;

        # Off deliberately: Next streams RSC payloads, and buffering delays first byte.
        proxy_buffering off;
    }
}
