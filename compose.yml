# Local development database. Start with: docker compose up -d
# Connection string (matches .env.example / .env): postgresql://postgres:postgres@localhost:5432/visualsofdsa

name: visualsofdsa

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-visualsofdsa}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-visualsofdsa}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
