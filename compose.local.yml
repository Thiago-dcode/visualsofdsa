name: visualsofdsa

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    env_file: ${VISUALSOFDSA_ENVFILE:-.env}
    # Inside the compose network the database is reachable as `db`, not localhost.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-visualsofdsa}
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-visualsofdsa}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    networks:
      - visualsofdsa-net

  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-visualsofdsa}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-visualsofdsa}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - visualsofdsa-net

volumes:
  db-data:
networks:
  visualsofdsa-net:
